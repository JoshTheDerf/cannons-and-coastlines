# Site-wide settings: brand, top nav, footer, the announcement bar.
# Edit any text here and it updates everywhere it appears on the site.

brand:
  name: Cannons & Coastlines
  tagline: A Tabletop Game of Naval Conquest
  logo: /assets/images/logo-with-wordmark-sm.webp
  icon: /assets/images/logo.png

# Top navigation links (left side of the nav bar). The footer's columns
# below use the same labels for the same pages.
nav:
  - label: How to play
    to: /#how-to-play
  - label: Fleets
    to: /#fleets
  - label: Shop
    to: /shop
  - label: Print guide
    to: /print-guide
  - label: Videos
    to: /#videos
  - label: About
    to: /#about

# The call-to-action button on the right of the nav bar.
cta:
  label: Get the free files
  to: /#files
  icon: i-lucide-download

# The announcement strip on every page. Delete the block to hide it
# (fields: pill, headline, extra, cta, to; see content.config.ts).
announce:
  pill: Recap
  headline: 'Playtest #2 is done.'
  extra: Watch both games on rulebook v0.6, with the finished ships and the new cannons.
  cta: Watch
  to: /playtest-2

footer:
  blurb: A 3D-printable naval game for 2 to 20 players, where you sink your friends' ships with actual cannons.
  columns:
    - title: Game
      links:
        - { label: How to play, to: /#how-to-play }
        - { label: Fleets, to: /#fleets }
        - { label: Rulebook (PDF), to: /rulebook/pdf/rulebook.pdf, external: true }
        - { label: Play online, to: /game/?online, external: true }
        - { label: Videos, to: /#videos }
        - { label: 'Playtest #2', to: /playtest-2 }
        - { label: First playtest, to: /live }
    - title: Printing
      links:
        - { label: Get the free files, to: /#files }
        - { label: Shop, to: /shop }
        - { label: Print guide, to: /print-guide }
        - { label: Base set print list, to: /print-list/base-set }
        - { label: GitHub, to: https://github.com/JoshTheDerf/cannons-and-coastlines/tree/main, external: true }
    - title: More
      links:
        - { label: About, to: /#about }
        - { label: Made with CubbyCAD, to: /tools }
        - { label: Starter pack (sold out), to: /starter-pack }
        - { label: Discord, to: https://discord.gg/DMuFEWJtZq, external: true }
        - { label: Privacy, to: /privacy }
        - { label: Terms and licenses, to: /terms }
  social:
    - { label: Discord, to: https://discord.gg/DMuFEWJtZq, icon: i-lucide-message-circle }
    - { label: GitHub, to: https://github.com/JoshTheDerf/cannons-and-coastlines/tree/main, icon: i-lucide-github }
  license: © 2026 Joshua Bemenderfer. The free base game is licensed under CC BY-NC-SA 4.0.
  licenseUrl: https://creativecommons.org/licenses/by-nc-sa/4.0/
