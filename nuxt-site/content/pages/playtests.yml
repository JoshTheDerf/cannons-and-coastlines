contents:
  rulesTitle: What's changed since the first playtest
  rulesLead: >-
    The rules have changed quite a bit since v0.3, mostly because of things
    that didn't work at the table last time.
  rules:
    - '**Ships are always underway.** Each ship takes one action (steer, fire or use an island), then sails forward at least one click. Islands are the only place a ship can stay put.'
    - '**You win by fighting.** Sitting on islands doesn''t win the game any more. You score for the islands you hold, the prizes you take off enemy ships and any coins you haven''t spent, and you can declare victory once you think you have 60 points.'
    - '**You keep what you shoot off.** Every fitting you knock off an enemy ship goes in front of you as a prize, and so does the hull of any ship you sink or capture.'
    - '**Cannons need a crew.** A cannon only fires if one of your ships is touching it and spends its action on it, so islands can''t shoot by themselves. Ricochets onto a second ship don''t count either.'
    - '**A new coin bag.** Signal Flags are gone, and Full Sail now lets one ship steer and sail twice (but it can''t fire that turn). You can also spend coins between ships, and your ship nearest each of your islands can collect a coin there, even from out at sea.'
    - '**Faster fleets.** Most fleets got an extra click of movement. The Corsairs are down to three sloops, the Islanders to one fitting, and the Treasure Fleet gets a third junk.'
  kitTitle: New ships and cannons
  kitLead: >-
    Most of the pieces on the table are new since last time, too.
  kit:
    - '**Finished ship designs.** All seven fleets are on their finished designs (below). The Queen''s Fleet and the Corsairs have new hulls, masts, cargo and wheels, and the Stone Fleet and the Islanders have new sails.'
    - '**Updated cannons.** Both the cannon and its barrel are new.'
    - '**New islands and coins.** The island stands on its own now and has six cannon slots, and the coins have engraved designs on top.'
  # The fleet pictures under this list come from shared/data/fleets.json.
