# The shared pieces, all in the free base set.
general:
  title: Islands, coins and terrain
  perPlayer:
    title: Per player
    parts:
      - part: Coins
        file: coin-*.stl
        files: [coin-brace-for-impact.stl, coin-full-sail.stl, coin-evasive-maneuver.stl, coin-skilled-gunner.stl, coin-repair-crew.stl, coin-boarding-party.stl]
        render: coin-skilled-gunner
        qty: 20
        color: coins
        note: 5 Brace for Impact, 2 Full Sail, 2 Evasive Maneuvers, 5 Skilled Gunner, 4 Repair Crew, 2 Boarding Party.
      - { part: Island, file: island.stl, qty: 1–2, color: islands, note: Or island-topper.stl on a box or a mug. }
      - { part: Short mast, file: mast-short.stl, qty: 1–2, color: masts, note: One per island, for its flag. }
  perTable:
    title: Per table
    parts:
      - { part: Rock, file: rock1.stl, qty: 2–6, color: rocks, note: 'With three or more players, 2 per fleet.' }
      - { part: Reef, file: reef.stl, qty: 0–2, color: reefs }
      - part: Wind dial
        file: wind-dial-*.stl
        files: [wind-dial-base.stl, wind-dial-vane.stl, wind-dial-washer.stl, wind-dial-cap.stl]
        render: wind-dial
        qty: 1 each
        color: dial
        note: Optional. A steel M8 washer spins better.
      - { part: Fit test, file: ship-tolerance-test.stl, qty: 1, color: fit-test, note: Print it first. }

# Other base-set files no row above counts. The zip check
# (print_guide.py check) accepts them without a warning.
extras: [island-topper.stl]

# What a game needs besides the prints. On /print-guide and the lists that
# include the base set (its PDF and the bundle's). An add-on fleet's list
# says it needs the base set in its `howTo` instead.
kit:
  title: Also needed
  body: >-
    Each player needs their faction card, some paper flags for the masts and
    a cloth bag for the coins.

# Printing and assembly, in order. A step with `needs` only shows on a list
# that has one of those files.
steps:
  title: Printing and putting it together
  items:
    - text: Print the fit test (ship-tolerance-test.stl in the base set) first. If a peg is loose, scale it up 0.5 to 1% in your slicer. If it's tight, sand it a bit. If it won't go in at all, your nozzle is probably too close to the bed.
    - text: Print a spare cannon or two. The arm loses tension after a few hundred shots.
    - text: Stretch a 10 mm rubber band or silicone cable tie around each wheel's rim and push the wheel into the slot under the stern. It should be snug but still spin, and it stays in.
    - text: Plug the fittings into the deck.
    - text: Slide the sails down over the masts, and a paper flag into the slot at the top of a mast.
      needs: [sail.stl, sail-damaged.stl, sail-treasure-fleet.stl, sail-stone-fleet.stl, sail-islanders.stl]
    - text: Plug a short mast into each island for its flag.
      needs: [island.stl]

# The all-fleets zip (bundles in nuxt-site/server/data/sets.json).
bundle:
  title: All fleets
  intro: >-
    There's a folder for each fleet, each with its own plates folder. The
    base-set folder also has the parts the add-on fleets borrow, and the
    islands, coins and terrain. The plates folder at the top has the masts,
    cargo, cannons and wheels for every fleet together.
