        - { part: Mast, file: mast.stl, each: 2, color: masts, base: true }
        - { part: Sail, file: sail.stl, each: 2, color: sails, base: true }
        - { part: Cargo, file: cargo.stl, each: 2, color: cargo, base: true }
        - { part: Movement wheel, file: movement-wheel.stl, each: 1, color: wheels, base: true }
