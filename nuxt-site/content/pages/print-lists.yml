# Print lists: the free base set's is on /print-guide (/print-list/base-set
# redirects there), every other set's and the bundle's on
# /print-list/<set-id>, and each one is also the PRINTING.pdf (plus
# PRINTING.md) inside its STL zip.
#
# One source for all of them:
#   - the base set page    nuxt-site/app/pages/print-guide.vue
#   - the other pages      nuxt-site/app/pages/print-list/[set].vue
#                          (both use composables/usePrintList.ts)
#   - the PDF              rulebook/typst/print-list.typ (npx jake print-lists)
#   - the Markdown         scripts/lib/print_guide.py
# Colors and settings come from print-guide.yml. `steps` below is also the
# assembly section of /print-guide. Rebuild the zips after editing (see
# print-guide.yml).
#
# Printing facts only, no faction backstory: this ships inside the downloads.
# Keep it short. An add-on fleet's PDF fits on one page and the base set's
# on two; the PDF build doesn't check that, so look at it (pdfinfo).
# `**bold**` and `*italic*` work in every text field.
#
# HOW THE COUNTS ARE WORKED OUT
#   ships     the faction card (rulebook/typst/factions.typ).
#   each      how many go on one ship. Masts, cargo and barrels are the
#             fittings on the faction card, split by the sockets on each hull
#             in nuxt-site/shared/data/ship-assemblies.json. A sail goes on
#             every mast. One wheel per ship.
#   qty       a fixed count for the whole fleet or table. Cannons (4) and
#             cannonballs (10) follow the rulebook's Print List.
#   color     an id from print-guide.yml `colors.rows`, or `hull` for the
#             fleet's hull color. `masts` and `sails` become the hull color
#             for a fleet with `matchRigging` in print-guide.yml.
#   base      the file comes from the free base set, not this fleet's zip.
#   supports  print with supports (default off).
#   files     the real file names, when `file` is a label for several.
#   render    image stem under assets/images/renders/, when it isn't the
#             file's own name.

# The /print-list/<set> page title is the fleet's name, and its description
# is written in print-list/[set].vue; only the intro lives here.
hero:
  intro: Every file to print, how many copies, what color and whether it needs supports.

# The free set every other list borrows parts from. The rows marked
# `base: true` say "from the base set".
base:
  set: base-set

# The numbered "How to do it" at the top of every print list: the pages,
# PRINTING.pdf and PRINTING.md. `web` is the site's wording, `file` the
# PDF's and the Markdown's (`fileFree` for the free zip, which has no plates
# folder). `buy` is for a paid list opened without the order key, `base` for
# an add-on fleet. Placeholders:
#   {zip}        the zip download         {page}      this list online
#   {base}       the base set (/print-guide)
#   {settings}   /print-guide#settings    {assembly}  /print-guide#assembly
howTo:
  title: How to do it
  get:
    web: '**Get the files.** [Download the zip]({zip}), or open the [plates below](#slicer) in CubbySlicer, one for each color.'
    file: '**Get the files.** The STLs are in this zip. The plates folder has a 3MF for each color, with the settings, for OrcaSlicer or CubbySlicer.'
    fileFree: '**Get the files.** The STLs are in this zip. To print from CubbySlicer, open the plates for each color at {page}.'
  buy:
    web: "**Get the files.** Buy them above. If you already have, open this list from your order page. The link is in your Stripe receipt email."
  base:
    web: '**Get the free [base set]({base}) too.** It has the masts, cargo, cannons and wheels (the plates below include them), and the coins, islands and terrain a game needs.'
    file: '**Get the free base set too**, from {base}. It has the masts, cargo, cannons and wheels, and the coins, islands and terrain a game needs.'
  print:
    web: '**Print each color.** The plates have the settings in them. If you slice the STLs yourself, use [these settings]({settings}).'
    file: '**Print each color** with the settings below.'
  build:
    web: '**Put it together** with the [assembly steps]({assembly}).'
    file: '**Put it together** with the steps at the end.'

