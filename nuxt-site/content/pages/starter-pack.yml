# Starter pack page (/starter-pack).

meta:
  title: First-Run Starter Pack
  description: >-
    The first ten Cannons & Coastlines starter packs are sold out. Join the
    waiting list for the next run.

hero:
  badge: Sold Out
  title: First-Run Starter Pack
  strike: true   # false removes the strikethrough on the title
  headline: All ten first-run packs are spoken for.
  subtitle: >-
    We're printing, packing, and shipping those now, and pausing new orders
    until they're out the door. The form below is a **waiting list** for the
    next run.
  cta: { label: Join the waiting list, to: '#order', icon: i-lucide-mail }

story:
  title: How this happened
  paragraphs:
    - >-
      I wanted a silly game to play with friends and the youth at my church.
      Battleship, but you shoot real cannons.
    - >-
      I roughed out a few models in TinkerCad, took them to the office, and it
      got out of hand. Now I want to play it. My friends want to play it. A
      lot of people on the internet want to play it too.
    - >-
      So my wife and I committed to print, pack, and ship ten starter packs
      by hand, to see if there's enough interest to make this a real game.
      All ten are claimed.
    - >-
      Once they ship we'll work out a bigger run. If you want one, join the
      waiting list below. We'll write when we know the timing and the price,
      which may change from this first batch.
  reelEmbed: https://www.instagram.com/p/DXEtgxttyCB/embed

contents:
  title: In the pack
  lead: One pack is a small game. Two packs is a proper one.
  showcase:
    - src: /assets/photos/starter-pack/queens-fleet-ship-sm.jpg
      alt: Queen's Fleet three-ship fleet with sails and faction card.
      caption: Queen's Fleet ship (×3)
    - src: /assets/photos/starter-pack/corsair-ship-sm.jpg
      alt: Corsair fleet of four small ships with sails and faction card.
      caption: Corsair ship (×4)
  # Bullets support **bold** and [link text](url).
  includes:
    - icon: i-lucide-ship
      title: One fleet, ready to sail
      items:
        - >-
          Your choice of the
          [**Corsairs**](/rulebook/pdf/faction-card-corsairs.pdf) (4 small
          ships) or the
          [**Queen's Fleet**](/rulebook/pdf/faction-card-queens-fleet.pdf)
          (3 larger ships)
        - "**Masts, sails, and flag holders** for every ship"
        - "**Movement wheels** and cargo, fitted"
        - "**Cannons, cannonballs, and coins**"
        - Three **island toppers** with flagpoles
        - "**Rocks and reefs**"
    - icon: i-lucide-book-open
      title: The paperwork
      items:
        - The current [**rulebook**](/rulebook/pdf/rulebook.pdf)
        - Your faction card
        - New versions to print off as the rules change
  wide:
    src: /assets/photos/starter-pack/all-parts-sm.jpg
    alt: All the printed parts in a starter pack laid out together.
    caption: Everything in a pack. Colors vary. Quantities match the rulebook.
  note: New pieces will stay compatible with this run wherever I can manage it.

form:
  title: Waiting list
  intro: >-
    **The first ten are sold out and orders are paused.** Fill this out and
    we'll email you when the next batch is ready to confirm details and
    payment. Pricing may differ from the first run.
  embed: https://docs.google.com/forms/d/1OLnbYcJYArcPI35-xBC18aw2Dtfe5haErApdzEqA3Jo/viewform?embedded=true
  fallback: https://docs.google.com/forms/d/1OLnbYcJYArcPI35-xBC18aw2Dtfe5haErApdzEqA3Jo/viewform

donate:
  title: Want to chip in?
  body: >-
    Outside the US, missed the first ten, or just want to help? It all goes
    to filament and table time.
  cta: { label: Buy me a coffee, url: https://buymeacoffee.com/joshthederf, icon: i-lucide-coffee }
  image:
    src: /assets/photos/starter-pack/kitten-for-scale-sm.jpg
    alt: A kitten next to printed game pieces, for size comparison.
    caption: Kitten for scale. Not included.
