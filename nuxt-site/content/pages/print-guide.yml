# Print guide page (/print-guide), and the printing half of the PRINTING.pdf
# and PRINTING.md inside every STL zip.
#
# One source for all of them: rulebook/typst/print-list.typ (the PDF) and
# scripts/lib/print_guide.py (the Markdown) read this file, plus the print
# lists in print-lists.yml and the assembly cards in parts.yml. After editing,
# rebuild: `npx jake print-lists` for the PDFs the site links, `npx jake stl`
# for the free base set zip, `npx jake publish-sets` for the paid sets and the
# all-fleets bundle.
#
# Printing facts only. This text ships inside the downloads, so no faction
# backstory here. `**bold**` works in every text field.

meta:
  title: Print Guide
  description: >-
    Slicer settings and filament colors for every Cannons & Coastlines fleet,
    from the Queen's Fleet to the Shadow Fleet.

hero:
  title: Print Guide
  intro: >-
    The slicer settings and colors for each fleet. The same guide comes in
    every STL download as PRINTING.md.

settings:
  title: Settings for everything
  lead: These work for every part in every fleet.
  # [label, value]
  rows:
    - [Material, PLA. For the Shadow Fleet, translucent PETG works well for a ghostly look.]
    - [Layer height, 0.16 mm or lower]
    - [Z contouring, 'On']
    - [Infill, 10% or more]
    - [Supports, Off. Only the Shadow Fleet and Treasure Fleet need them.]
  baseSet: >-
    The add-on fleet downloads have the hulls and each fleet's own parts. The
    masts, cargo, cannons and wheels come from the free base set.

colors:
  title: Colors by part
  lead: Hull colors are listed under each fleet.
  # id: the key the print lists (print-lists.yml) look a color up by.
  rows:
    - { id: masts, part: Masts, color: Brown }
    - { id: cargo, part: Cargo and barrels, color: Brown }
    - { id: sails, part: Sails, color: White }
    - { id: industry, part: Industry turrets and smokestacks, color: Rust brown or steel blue }
    - { id: cannons, part: Cannons, color: Black }
    - { id: cannonballs, part: Cannonballs, color: 'Something bright, like neon green or orange' }
    - { id: wheels, part: Movement wheels, color: Any }
    - { id: coins, part: Coins, color: Gold }
    - { id: islands, part: Islands and island toppers, color: 'Green, sand or grey' }
    - { id: rocks, part: Rocks, color: Grey }
    - { id: reefs, part: Reefs, color: Pale pink }
    - { id: dial, part: Wind dial, color: Any }
    - { id: fit-test, part: Fit test, color: Anything }
  note: >-
    The Corsairs and the Shadow Fleet are the exceptions. Print their masts and
    sails in the same color as the hull.

fleets:
  title: By fleet
  lead: Anything not listed for a fleet uses the settings and part colors above.
  # id: the shop handle, also the #anchor on /print-guide.
  # set: the sets.json id whose zip this fleet's guide goes into.
  # hull: hull color. Leave it out if there isn't one yet.
  # matchRigging: masts and sails are printed in the hull color.
  # supports / petg: overrides of the defaults above.
  # parts: extra per-fleet part colors, [part, color].
  items:
    - id: queens-fleet
      name: Queen's Fleet
      set: base-set
      hull: Pale blue-grey or brown
    - id: corsairs
      name: Corsairs
      set: base-set
      hull: Black
      matchRigging: true
    - id: treasure-fleet
      name: Treasure Fleet
      set: treasure-fleet-set
      hull: Silk gold
      supports: true
    - id: stone-fleet
      name: Stone Fleet
      set: stone-fleet-set
      hull: Matte grey, speckled rock filament, or both
    - id: shadow-fleet
      name: Shadow Fleet
      set: shadow-fleet-set
      hull: Translucent gradient filament
      matchRigging: true
      supports: true
      petg: true
    - id: industry
      name: The Industry
      set: industry-set
      hull: Rust brown or steel blue
      parts:
        - [Turrets and smokestacks, Rust brown or steel blue]
    - id: islanders
      name: The Islanders
      set: islander-set
      hull: Pine, or a light brown wood color
