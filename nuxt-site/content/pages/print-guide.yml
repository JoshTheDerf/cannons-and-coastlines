# Print guide page (/print-guide): the settings, the free base set's print
# list and download, how it all goes together, and a card for each add-on
# fleet. /print-list/base-set and /parts redirect here. Also the printing
# half of the PRINTING.pdf and PRINTING.md inside every STL zip.
#
# rulebook/typst/print-list.typ (the PDF) and scripts/lib/print_guide.py (the
# Markdown) read `settings`, `colors` and `fleets` from this file, plus the
# print lists, the "How to do it" steps and the assembly steps in
# print-lists.yml. After editing those, rebuild: `npx jake print-lists` for
# the PDFs the site links, `npx jake stl` for the free base set zip,
# `npx jake publish-sets` for the paid sets and the all-fleets bundle.
# `hero` and `assembly` are site only.
#
# Where the rest lives, so it isn't repeated here:
#   how many of each to print    print-lists.yml (the tables on this page
#                                and on /print-list/<set>)
#   the fleets, stats and cards  shared/data/fleets.json (/shop/<fleet>)
#
# Printing facts only. This text ships inside the downloads, so no faction
# backstory here. `**bold**` works in every text field.

seo:
  title: Print Guide
  description: >-
    The free Cannons & Coastlines base set: what to print, the slicer
    settings and colors, CubbySlicer plates and how it goes together.

hero:
  title: Print Guide
  intro: >-
    What to print for the free base set, the settings and colors, and how it
    goes together. The add-on fleets have their own print lists, linked at
    the bottom.

settings:
  title: Settings
  lead: These work for every part in every fleet. The tables say which parts need supports.
  # [label, value]
  rows:
    - [Material, PLA]
    - [Layer height, "0.12–0.20 mm (0.16 mm recommended)"]
    - [Z contouring, 'On']
    - [Walls, '4']
    - [Orientation, Use your slicer's auto-orient.]
    - [Infill, 10% or more]

# The color for each kind of part. The print lists (print-lists.yml) look a
# color up by `id`; hull colors are under `fleets`.
colors:
  rows:
    - { id: masts, part: Masts, color: Brown }
    - { id: cargo, part: Cargo and barrels, color: Brown }
    - { id: sails, part: Sails, color: White }
    - { id: industry, part: Industry turrets and smokestacks, color: Rust brown or steel blue }
    - { id: cannons, part: Cannons, color: Black }
    - { id: cannonballs, part: Cannonballs, color: 'Something bright, like neon green or orange' }
    - { id: wheels, part: Movement wheels, color: Any }
    - { id: coins, part: Coins, color: Gold }
    - { id: islands, part: Islands and island toppers, color: 'Green, sand or grey' }
    - { id: rocks, part: Rocks, color: Grey }
    - { id: reefs, part: Reefs, color: Pale pink }
    - { id: dial, part: Wind dial, color: Any }
    - { id: fit-test, part: Fit test, color: Anything }

# Every fleet's hull color and the rest. The page shows a card for each
# add-on fleet; the two base-set fleets are the tables near the top.
fleets:
  title: Add-on fleets
  lead: >-
    Each one has its own print list. Their downloads have the hulls and the
    fleet's own parts, and the masts, cargo, cannons and wheels come from the
    base set above.
  # id: the shop handle, also the #anchor on /print-guide.
  # set: the sets.json id whose zip this fleet's guide goes into.
  # hull: hull color and material. Leave it out if there isn't one yet.
  # matchRigging: masts and sails are printed in the hull color.
  # supports: some of this fleet's parts need supports (the default is none).
  # parts: extra per-fleet part colors, [part, color].
  items:
    - id: queens-fleet
      name: Queen's Fleet
      set: base-set
      hull: Pale blue-grey or brown PLA
    - id: corsairs
      name: Corsairs
      set: base-set
      hull: Black PLA
      matchRigging: true
    - id: treasure-fleet
      name: Treasure Fleet
      set: treasure-fleet-set
      hull: Silk gold PLA
      supports: true
    - id: stone-fleet
      name: Stone Fleet
      set: stone-fleet-set
      hull: Matte grey or speckled rock PLA, or both
    - id: shadow-fleet
      name: Shadow Fleet
      set: shadow-fleet-set
      hull: Translucent gradient PLA or PETG
      matchRigging: true
      supports: true
    - id: industry
      name: The Industry
      set: industry-set
      hull: Rust brown or steel blue PLA
      parts:
        - [Turrets and smokestacks, Rust brown or steel blue PLA]
    - id: islanders
      name: The Islanders
      set: islander-set
      hull: Pine or light brown wood PLA

# The steps are print-lists.yml `steps`, the same list every PRINTING.pdf
# has, so there's one copy of them.
assembly:
  title: Putting it together
  lead: >-
    Everything press-fits, so you don't need glue or tools. The wheel is the
    only part you fit once and leave in.
