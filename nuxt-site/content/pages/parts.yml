# Parts page (/parts).
# What each piece is, how it goes together, how to print it, how many to print.
# Keep this in step with "The Parts" and "The Print List" in rulebook/typst/rulebook.typ.

meta:
  title: The Parts
  description: >-
    Every piece in the Cannons & Coastlines base set. What it does, how it
    fits, how to print it, and how many you need.

hero:
  title: The Parts
  intro: Every piece in the base set. What it does, how it fits, and how to print it.

gallery:
  title: The Hulls
  lead: >-
    One hull per fleet. A movement wheel sits in the stern and cannon slots
    run along the deck. How many you print is on your faction card.
  # Renders come from assets/ships/renders/ (scripts/blender/render_ship_previews.sh),
  # in the filament each fleet is meant to be printed in (scripts/blender/cc_config.py).
  # `desc` and `color` accept **bold** and *italic*.
  hulls:
    - render: /assets/ships/renders/ship-queens-fleet.png
      name: Queen's Fleet
      badge: Base set
      desc: Ship of the line. Three broadside slots a side, four fittings.
      color: Blue-grey, or your fleet color.
    - render: /assets/ships/renders/ship-corsair.png
      name: Corsairs
      badge: Base set
      desc: Sloop. Smaller, quicker, three fittings.
      color: Black, or your fleet color.
    - render: /assets/ships/renders/ship-treasure-fleet.png
      name: Treasure Fleet
      badge: Add-on
      desc: Deep-holded galleon. Fewer ships, more coin.
      color: Gold.
    - render: /assets/ships/renders/ship-sun-fleet.png
      name: Sun Fleet
      badge: Add-on
      desc: Carved stone. Slow, hard to sink.
      color: Stone grey.
    - render: /assets/ships/renders/ship-shadow-fleet.png
      name: Shadow Fleet
      badge: Add-on
      desc: Thin hull that comes back from the deep.
      color: Translucent teal-to-purple gradient **PETG**.
    - render: /assets/ships/renders/ship-industry.png
      name: The Industry
      badge: Add-on
      desc: Iron hull with a separate **turret** and **smokestack** that plug in like fittings.
      color: Rust brown. Turret grey, stack black.
    - render: /assets/ships/renders/ship-islander.png
      name: The Islanders
      badge: Add-on
      desc: Catamaran with a gun astern. One fitting.
      color: Pine.
  partsTitle: The Pieces
  partsLead: Everything else in the base set. Colors are suggestions. Your flag color always wins.
  items:
    - render: /assets/images/renders/mast.png
      name: Mast
      desc: A *fitting*. Plugs into the deck and comes off when the ship takes a hit. Flag holders sit on top.
      color: Brown or black.
    - render: /assets/images/renders/cargo.png
      name: Cargo
      desc: A *fitting*. Crates in the hold. Comes off when the ship takes a hit.
      color: Crate brown.
    - render: /assets/images/renders/sail.png
      name: Sail
      desc: Slides over a mast. Cosmetic, but it's how you tell fleets apart across the table.
      color: White, black, or whatever suits your fleet.
    - render: /assets/images/renders/sail-damaged.png
      name: Damaged Sail
      desc: A torn sail. Cosmetic. Good on pirates.
      color: Same as your sails, or something scorched.
    - render: /assets/images/renders/cannon.png
      name: Cannon
      desc: The gun. Plugs into any cannon slot on a ship or island. Press the arm down until it fires.
      color: Black or gunmetal.
    - render: /assets/images/renders/cannonball.png
      name: Cannonball
      desc: Goes in the muzzle. Easy to lose.
      color: Something bright. Neon green or orange finds itself under the couch. **TPU** bounces less.
    - render: /assets/images/renders/movement-wheel.png
      name: Movement Wheel
      desc: Lives in the stern. One full turn is one *click* of movement. The flat spot parks the ship.
      color: Any. Needs a thin **rubber band** around the rim or it won't click.
    - render: /assets/images/renders/paper-flag-holder.png
      name: Paper Flag Holder
      desc: >-
        Slide a paper flag into the slot and set the holder on a mast. Draw
        your own flag; no printing needed.
      color: Any. The paper does the talking.
    - render: /assets/images/renders/island-topper.png
      name: Island Topper
      desc: A puck with cannon slots and flag holes. Set it on a box, a book, or an upside-down mug and you have an island.
      color: Sand, grey, or green.
    - render: /assets/images/renders/coin-full-sail.png
      name: Coins
      desc: >-
        Seven kinds: Brace, Signal, Full Sail, Evasive, Gunner, Repair,
        Boarding. Draw from the bag, spend at the start of your turn.
      color: Gold. Silk PLA if you have it.

assembly:
  title: Putting It Together
  lead: Everything press-fits. No glue, no tools. The wheel is the only thing you build once.
  cards:
    - icon: i-lucide-ship
      title: The ship (once)
      ordered: true
      items:
        - Stretch a thin **rubber band** around the rim of the **wheel**.
        - Push the wheel into the slot under the stern. Snug fit. The wheel should still spin.
    - icon: i-lucide-anchor
      title: Fittings (every game)
      items:
        - "**Masts** and **cargo** plug into the deck."
        - "**Sails** slide down over the masts."
        - Each hit knocks off one fitting. How many you have is on your faction card. A bare hull sinks on the next hit.
    - icon: i-lucide-crosshair
      title: Cannons
      items:
        - Plug the **cannon** into any open slot on a ship or an island.
        - Drop in a **cannonball** and press the arm down until it fires.
        - Cannons aren't fixed. Pull one and move it to another slot between shots.
    - icon: i-lucide-flag
      title: Flags and islands
      items:
        - Slide a paper flag into a **flag holder** and set the holder on a mast.
        - "**Island toppers** go on top of anything the right height. Same cannon slots and flag holes as a ship."
    - icon: i-lucide-coins
      title: Coins
      body: >-
        Nothing to build. Print them and drop them in a cloth bag. Each
        player adds 20 at setup.
    - icon: i-lucide-ruler
      title: Fit
      body: >-
        Loose peg? Scale it up **0.5 to 1%** in your slicer. Tight? Sand it.
        If masts won't seat at all, your nozzle is probably too close to the bed.

printing:
  title: Printing
  lead: The rulebook defaults cover almost everything. The exceptions are below.
  # Shown as a single row of label / value pairs.
  defaults:
    - [Layer height, 0.16 or 0.2 mm]
    - [Infill, '15%']
    - [Material, PLA or PETG]
    - [Supports, Rarely. Some hulls print cleaner with them.]
  # Part-specific notes. `body` accepts **bold** and *italic*.
  notes:
    - icon: i-lucide-crosshair
      title: Cannons
      body: >-
        Orient the flex arm so the layers run **across** the bend, not along
        it. Layers parallel to the flex split under load. Print a couple of
        spares; the arm loses tension after a few hundred shots.
    - icon: i-lucide-circle-dot
      title: Cannonballs
      body: >-
        **TPU** with three walls and no infill bounces far less than PLA.
        Coarser layers shoot harder and less predictably.
    - icon: i-lucide-anchor
      title: Masts
      body: Print them lying flat.
    - icon: i-lucide-coins
      title: Coins
      body: Silk gold gives the sheen in the renders. Matte gold is fine.
    - icon: i-lucide-target
      title: Before you play
      body: >-
        No two cannons shoot quite the same, and they soften with use. Fire a
        few practice rounds at the start of each game.

quantities:
  title: The Print List
  lead: >-
    One faction set is one player's fleet plus their share of terrain and
    coins. You print one, a friend prints one, and you have a game.
  # rows: [piece, quantity, notes]. Notes accept **bold** and *italic*.
  rows:
    - [Ships, 2–5, Count is on your faction card.]
    - [Masts, 1 per ship + 1 per island, Plus a few spares.]
    - [Cargo, varies, Enough to fill your ships' fitting slots.]
    - [Sails, 1 per mast, Decorate them.]
    - [Cannons, 3–4, One will do. Spares are nice when one wears out.]
    - [Cannonballs, '10', You will lose some.]
    - [Flag holders, 1 per mast + 5, Covers your ships, your islands, and any ship you capture.]
    - [Movement wheel, 1 per ship, Fit once with its rubber band. Hard to get back out.]
    - [Islands, 2–3, Print them, or use **island toppers** on household objects.]
    - [Rocks and reefs, 2–4, Optional. Rocks block ships and shots. Reefs block ships only.]
    - [Coins, 1 set of 20, 2 Brace · 2 Signal · 4 Full Sail · 2 Evasive · 4 Gunner · 4 Repair · 2 Boarding]
  notPrinted: "**Not printed:** one cloth draw bag for the table, and a thin rubber band per wheel."

cta:
  title: Get the Files
  body: >-
    The STL pack and rulebook go out to the mailing list and get pinned in
    the Discord. They still change between playtests.
  buttons:
    - { label: Mailing list, to: /#signup, icon: i-lucide-mail, variant: solid }
    - { label: Discord, to: https://discord.gg/DMuFEWJtZq, icon: i-lucide-message-circle, variant: outline }
    - { label: Rulebook PDF, to: /rulebook/pdf/rulebook.pdf, icon: i-lucide-file-text, variant: outline }
