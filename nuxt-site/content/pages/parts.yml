# Parts page (/parts).
# What each piece is, how it goes together, how to print it, how many to print.
# Keep this in step with "The Parts" and "The Print List" in rulebook/typst/rulebook.typ.

meta:
  title: The Parts
  description: >-
    What each piece in the Cannons & Coastlines base set does, how it goes
    together, how to print it and how many you need.

hero:
  title: The Parts
  intro: What each piece in the base set does, how it goes together and how to print it.

gallery:
  title: The Hulls
  lead: >-
    One hull per fleet. A movement wheel sits in the stern and cannon slots
    run along the deck. How many you print is on your faction card.
  # Renders come from assets/ships/renders/ (scripts/blender/render_ship_previews.sh),
  # in the filament each fleet is meant to be printed in (scripts/blender/cc_config.py).
  # `desc` and `color` accept **bold** and *italic*.
  # _headers caches /assets/images/ and /assets/ships/ as immutable for a year,
  # so a re-rendered image needs a new ?v= here or returning visitors keep the old one.
  hulls:
    - render: /assets/ships/renders/ship-queens-fleet.png?v=0.5
      name: Queen's Fleet
      badge: Base set
      desc: A frigate with three broadside slots on each side and four fittings.
      color: Blue-grey, or your fleet color.
    - render: /assets/ships/renders/ship-corsair.png?v=0.5
      name: Corsairs
      badge: Base set
      desc: A sloop. It's smaller and quicker than the frigate, with three fittings.
      color: Black, or your fleet color.
    - render: /assets/ships/renders/ship-treasure-fleet.png
      name: Treasure Fleet
      badge: Add-on
      desc: A junk with a deep hold. You get fewer ships, but more coin.
      color: Gold.
    - render: /assets/ships/renders/ship-stone-fleet.png
      name: Stone Fleet
      badge: Add-on
      desc: A carved stone barge. Slow, but pretty hard to sink.
      color: Stone grey.
    - render: /assets/ships/renders/ship-shadow-fleet.png?v=2
      name: Shadow Fleet
      badge: Add-on
      desc: A thin-hulled galleon that can come back after it sinks.
      color: Translucent teal-to-purple gradient **PETG**.
    - render: /assets/ships/renders/ship-industry.png
      name: The Industry
      badge: Add-on
      desc: Iron hull with a separate **turret** and **smokestack** that plug in like fittings.
      color: Rust brown. Turret grey, stack black.
    - render: /assets/ships/renders/ship-islander.png
      name: The Islanders
      badge: Add-on
      desc: A catamaran with its guns at the back and a single fitting. It takes the **short mast**.
      color: Pine.
  partsTitle: The Pieces
  partsLead: Everything else in the base set. The colors are just suggestions.
  items:
    - render: /assets/images/renders/mast.png?v=0.5
      name: Mast
      desc: A *fitting*. Plugs into the deck and comes off when the ship takes a hit. The flag holder is built into the top.
      color: Brown or black.
    - render: /assets/images/renders/mast-short.png
      name: Short Mast
      desc: The same mast, cut down. It goes on islands and on Islander catamarans.
      color: Same as your masts.
    - render: /assets/images/renders/cargo.png?v=0.5
      name: Cargo
      desc: A *fitting*. A chest of supplies that comes off when the ship takes a hit.
      color: Wood brown.
    - render: /assets/images/renders/barrel.png
      name: Barrel
      desc: A *fitting*, like cargo. It plugs into the deck and comes off when the ship takes a hit.
      color: Wood brown.
    - render: /assets/images/renders/sail.png
      name: Sail
      desc: Slides over a mast. Cosmetic, but it's how you tell fleets apart across the table.
      color: White, black, or whatever suits your fleet.
    - render: /assets/images/renders/sail-damaged.png?v=2
      name: Damaged Sail
      desc: A torn sail. It's just cosmetic, but it looks good on pirates.
      color: Same as your sails, or something scorched.
    - render: /assets/images/renders/cannon.png?v=0.5
      name: Cannon
      desc: The gun. It plugs into any cannon slot on a ship or island, and you press the arm down until it fires.
      color: Black or gunmetal.
    - render: /assets/images/renders/cannonball.png?v=3
      name: Cannonball
      desc: Goes in the muzzle. They're really easy to lose.
      color: Something bright, since neon green or orange is a lot easier to find under the couch. **TPU** bounces less.
    - render: /assets/images/renders/movement-wheel.png?v=0.5
      name: Movement Wheel
      desc: Lives in the stern. One full turn is one *click* of movement. The flat spot parks the ship.
      color: Any. Needs a thin **rubber band** around the rim or it won't click.
    - render: /assets/images/renders/island.png
      name: Island
      desc: A whole island that sits right on the table, so you don't need anything under it. Cannon slots on top, and a short mast holds your flag.
      color: Green, sand, or grey.
    - render: /assets/images/renders/island-topper.png
      name: Island Topper
      desc: A puck with cannon slots and flag holes. Set it on a box, a book, or an upside-down mug and you have an island.
      color: Sand, grey, or green.
    - render: /assets/images/renders/coin-skilled-gunner.png
      name: Coins
      desc: >-
        There are six kinds (Brace, Full Sail, Evasive, Gunner, Repair and
        Boarding). You draw them from the bag and spend them before any of
        your ships takes its turn.
      color: Gold. Silk PLA if you have it.
    - render: /assets/images/renders/ship-tolerance-test.png
      name: Fit Test
      desc: A small block with the same slots as a hull. Print it first to check that your masts, cargo and cannons fit before you print a whole fleet.
      color: Anything. You'll throw it away.

assembly:
  title: Putting It Together
  lead: Everything press-fits, so you don't need glue or tools. The wheel is the only part you fit once and leave in.
  cards:
    - icon: i-lucide-ship
      title: The ship (once)
      ordered: true
      items:
        - Stretch a thin **rubber band** around the rim of the **wheel**.
        - Push the wheel into the slot under the stern. It should be snug but still spin.
    - icon: i-lucide-anchor
      title: Fittings (every game)
      items:
        - "**Masts**, **cargo** and **barrels** plug into the deck."
        - "**Sails** slide down over the masts."
        - Each hit knocks off one fitting. How many you have is on your faction card. A bare hull sinks on the next hit.
    - icon: i-lucide-crosshair
      title: Cannons
      items:
        - Plug the **cannon** into any open slot on a ship or an island.
        - Drop in a **cannonball** and press the arm down until it fires.
        - You can pull a cannon and move it to another slot between shots.
    - icon: i-lucide-flag
      title: Flags and islands
      items:
        - Slide a paper flag into the slot at the top of a **mast**.
        - "**Islands** sit straight on the table. Plug a **short mast** in to fly your flag."
        - "**Island toppers** go on top of anything the right height. Same cannon slots and flag holes as a ship."
    - icon: i-lucide-coins
      title: Coins
      body: >-
        There's nothing to build. Just print them and drop them in a cloth
        bag. Each player adds 20 at setup.
    - icon: i-lucide-ruler
      title: Fit
      body: >-
        Print the **fit test** first. If a peg is loose, scale it up **0.5 to
        1%** in your slicer. If it's tight, sand it a bit. If masts won't
        seat at all, your nozzle is probably too close to the bed.

printing:
  title: Printing
  lead: The rulebook defaults cover almost everything. The exceptions are below.
  # Shown as a single row of label / value pairs.
  defaults:
    - [Layer height, 0.16 or 0.2 mm]
    - [Infill, '15%']
    - [Material, PLA or PETG]
    - [Supports, Rarely. Some hulls print cleaner with them.]
  # Part-specific notes. `body` accepts **bold** and *italic*.
  notes:
    - icon: i-lucide-crosshair
      title: Cannons
      body: >-
        Orient the flex arm so the layers run **across** the bend. If they
        run along it, the arm splits under load. Print a couple of spares,
        since the arm loses tension after a few hundred shots.
    - icon: i-lucide-circle-dot
      title: Cannonballs
      body: >-
        **TPU** with three walls and no infill bounces far less than PLA.
        Coarser layers shoot harder and less predictably.
    - icon: i-lucide-anchor
      title: Masts
      body: Print them lying flat, short masts too.
    - icon: i-lucide-coins
      title: Coins
      body: Silk gold gives the sheen in the renders. Matte gold is fine.
    - icon: i-lucide-target
      title: Before you play
      body: >-
        No two cannons shoot quite the same, and they soften with use. Fire a
        few practice rounds at the start of each game.

quantities:
  title: The Print List
  lead: >-
    One faction set is one player's fleet plus their share of terrain and
    coins. If you print one and a friend prints another, you have a game.
  # rows: [piece, quantity, notes]. Notes accept **bold** and *italic*.
  rows:
    - [Ships, 2–5, Count is on your faction card.]
    - [Masts, 1 per ship + 1 per island, Plus a few spares. Use **short masts** on islands and Islander ships.]
    - [Cargo and barrels, varies, Enough to fill your ships' fitting slots.]
    - [Sails, 1 per mast, Decorate them.]
    - [Cannons, 3–4, You can get by with one, but spares are nice when one wears out.]
    - [Cannonballs, '10', You will lose some. (Check under the couch.)]
    - [Movement wheel, 1 per ship, Fit once with its rubber band. Hard to get back out.]
    - [Islands, 2–3, Print **islands**, or use **island toppers** on household objects.]
    - [Rocks and reefs, 2–4, Optional. They block ships and cannonballs.]
    - [Fit test, 1, Print it before anything else.]
    - [Coins, 1 set of 20, 5 Brace · 2 Full Sail · 2 Evasive · 5 Gunner · 4 Repair · 2 Boarding]
  notPrinted: "**Not printed:** one cloth draw bag for the table, and a thin rubber band per wheel."

cta:
  title: Get the Files
  body: >-
    The STL pack and rulebook go out to the mailing list and get pinned in
    the Discord. Expect them to change between playtests.
  buttons:
    - { label: Mailing list, to: /#files, icon: i-lucide-mail, variant: solid }
    - { label: Discord, to: https://discord.gg/DMuFEWJtZq, icon: i-lucide-message-circle, variant: outline }
    - { label: Rulebook PDF, to: /rulebook/pdf/rulebook.pdf, icon: i-lucide-file-text, variant: outline }
