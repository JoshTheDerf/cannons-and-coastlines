about:
  title: Who's Behind This
  video: https://www.youtube.com/embed/I8fr532RWB0
  paragraphs:
    - >-
      I'm Joshua Bemenderfer, a software engineer by day. I wanted a
      Battleship where you move, aim, and fire for real. It got away from me
      and went viral, so now a small crew of us (my wife and a few
      coworkers) are making it properly.
    - >-
      We design every piece, print it, and play it. If a rule doesn't work at
      the table, it gets rewritten. The base game is free for anyone with a
      printer. Paid add-on fleets pay for the next round.
