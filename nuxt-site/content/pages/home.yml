changelog:
  title: From the Playtest Table
  description: What the first full-fleet game changed in rulebook v0.4.
  version: v0.4
  released: '2026-05-18'
  items:
    - icon: i-lucide-gauge
      title: Faster fleets
      body: Every faction except the Islanders gains a click of movement. Shadow Fleet now matches Queen's Fleet.
    - icon: i-lucide-anchor
      title: Corsairs down to three sloops
      body: Four was too much to track each turn. Three sloops at Move Count 4 still flank fine.
    - icon: i-lucide-skull
      title: Islanders down to one fitting
      body: One hit leaves a canoe dead in the water. Fast and fragile, as intended.
    - icon: i-lucide-flag
      title: Deploy at the table edge
      body: Ships start touching the edge. The old 3-inch buffer wasted space.
    - icon: i-lucide-crosshair
      title: Ricochets
      body: The first ship a cannonball touches takes the hit. Bounces after that do nothing.
    - icon: i-lucide-users
      title: Cannons need a crew
      body: To fire any cannon, a ship of yours must be touching it and spend its action. Islands no longer fire on their own.
    - icon: i-lucide-wind
      title: Always Underway
      body: Optional mode. Ships must move forward every turn and may steer or fire, not both.

