signup:
  title: Get the free files
  body: >-
    The base game is free. Subscribe and we'll email you the STL pack and the
    printable rulebook, and let you know when there's a new fleet or a rules
    update. You'll need a 3D printer, a small cloth bag for the coins and a
    few 10 mm rubber bands or silicone cable ties for the wheels.
  perks:
    - 'STLs for both base fleets, cannons, cannonballs, islands, rocks and coins'
    - Rulebook and faction cards (PDF)
    - Emails when new fleets and rules come out
  publicRulebook:
    label: Just want the rules? Read the rulebook PDF.
    href: /rulebook/pdf/rulebook.pdf
  partsLink:
    label: Rather skip the email? Download the base set directly.
    to: /print-list/base-set
  kitUid: a74f27ac96
  kitSrc: https://cannons-and-coastlines.kit.com/a74f27ac96/index.js
  discord:
    title: Join the Discord
    body: It's where the playtesters hang out, and new files and rules drafts get posted there first.
    url: https://discord.gg/DMuFEWJtZq
    qr: https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://discord.gg/DMuFEWJtZq

# The browser game at /game/. /game/ opens its title screen ("Play the
# computer" is the first button there) and /game/?online opens the online
# game list. Screenshots are from the real game, 3D view.
playOnline:
  title: Want to learn how to play? Play online
  lead: >-
    There's a browser version of the game, and it's pretty much the quickest
    way to learn the rules. You can play against the computer or online with
    friends, and you don't have to print anything first.
  body: >-
    (Short on players? The computer can take the empty seats in an online
    game.)
  actions:
    - { label: Play the computer, to: /game/, icon: i-lucide-bot, variant: solid }
    - { label: Play online with friends, to: /game/?online, icon: i-lucide-users, variant: outline }
  shots:
    - src: /assets/images/game/table-overview.webp
      alt: The web game's 3D view of a round table, with three white Queen's Fleet ships near the bottom edge, black Corsair ships across the table and green islands between them.
      caption: A game against the computer.
    - src: /assets/images/game/aiming.webp
      alt: A Queen's Fleet ship lining up a shot at a Corsair ship, with Fire, Tipped up and Straight buttons around it.
      caption: Lining up a shot.

about:
  title: Who's making this
  video: https://www.youtube.com/embed/I8fr532RWB0
  paragraphs:
    - >-
      I'm Joshua Bemenderfer, a software engineer by day. I wanted a
      Battleship-style game where you actually move your ships around and aim
      your own shots. It got a bit out of hand after the reel went viral, so
      now a small crew of us (my wife and a few coworkers) are making it for
      real.
    - >-
      We design and print all of the pieces ourselves, and the rules get
      changed pretty much every time a playtest turns up a problem. The base
      game is free to download and print, and it'll stay that way.
    - 'The ships and parts are modeled in CubbyCAD, a browser CAD app I made for this game, and sliced in Cubby Slicer, my web port of OrcaSlicer. [Here''s how](/tools).'
