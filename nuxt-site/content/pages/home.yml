meta:
  title: Cannons & Coastlines | A Tabletop Game of Naval Conquest
  description: >-
    A 3D-printable tabletop naval game for 2 to 20 players. Ships roll
    across the table, the cannons actually fire, and you fight over islands
    for treasure.

hero:
  wordmark: /assets/images/wordmark-sm.webp
  tagline: A tabletop game of naval conquest
  description: >-
    You print a small fleet of ships, roll them across the table and sink
    your friends with cannons that actually fire. There's no board and no
    dice.
  facts: 2–20 players · 30–90 minutes · Ages 10+ · Free to print
  actions:
    - { label: Get the free files, to: '#files', variant: solid, icon: i-lucide-download }
    - { label: How to play, to: '#how-to-play', variant: outline }

intro:
  title: What it is
  paragraphs:
    - >-
      Each player gets a fleet of two to five 3D-printed ships. There's a
      wheel in the stern of every hull that clicks once per turn of the
      wheel, and that's how you measure movement. There's no grid, so you
      can push your ships anywhere on the table.
    - >-
      The cannons are little tension-loaded pieces that plug into slots on
      the deck. You load a cannonball, press down on the arm, and it fires
      across the table. Whether it hits is pretty much up to your aim (and
      a bit of luck).
    - >-
      Islands sit between the fleets. Plant your flag on one and it pays
      out coins, which you spend on things like repairs and extra shots, or
      save up as points.
  photo:
    src: /assets/photos/queens-fleet-ship-of-the-line-hero-sm.jpg
    alt: A black Queen's Fleet ship with white paper sails and gold flags.
  reel:
    embed: https://www.instagram.com/p/DXEtgxttyCB/embed
    url: https://www.instagram.com/p/DXEtgxttyCB/
    label: The reel that started it (3.3M views)

howToPlay:
  title: How to play
  lead: >-
    This is the short version of the rulebook, in the order things happen at
    the table. It's pretty much enough to play your first game.
  steps:
    - title: Set up
      body:
        - >-
          Everyone picks a fleet and takes its ships, flags, cannons and
          cannonballs. Going around the table, each player places one island.
          Keep islands at least **6"** apart and **12"** from the edges.
        - >-
          Add a few rocks or reefs if you like (household objects work fine).
          Then everyone picks a table edge and lines up their ships touching
          it, facing in.
        - >-
          Each player puts their 20 coins into a bag and gives it a shake.
          The youngest player goes first.
      table:
        head: [Players, Islands]
        rows:
          - [2, 4]
          - [3–4, 6]
          - [5–6, 8]
          - [Group mode (6–20), 10–12]
    - title: Take your turn
      body:
        - >-
          First, spend any coins you want to use. Ships are always sailing, so
          **each of your ships takes one action, then clicks forward** at
          least once, up to your fleet's Move Count:
      actions:
        - name: Steer
          body: >-
            Turn the ship up to 90°. Steering doesn't move it (the forward
            clicks do that).
        - name: Fire
          body: >-
            Plug a cannon into an open slot and press it until it fires. The
            ship can't turn on a turn it fires, so you line up the shot the
            turn before. The shot happens before it sails on.
        - name: Island
          body: >-
            If the ship is touching an island, it can raise your flag there
            (if the ship was already touching it at the end of your last
            turn), collect a coin from the bag (if it's your island), or fire
            from one of the island's cannon slots. It then stays put, which
            makes islands the only place a ship can hold still.
      photo:
        src: /assets/photos/playtest-overhead-island-sm.jpg
        alt: Four ships around an island on a carpet during a playtest.
      note: >-
        A ship that bumps into a ship, island or rock stops there. Watch the
        table edge, too: a ship that runs out of room stops there, and a ship
        that would be forced off the table sinks. Also, a cannon only
        fires if one of your ships is touching it and spends its action on
        it, so a held island can't shoot at anyone by itself.
    - title: Take hits
      body:
        - >-
          Every hit knocks one **fitting** (a mast or a crate of cargo) off
          the ship. A ship with no fittings left is **dead in the water**. It
          can't move, but it can still fire. The next hit sinks it.
        - >-
          The first ship a cannonball touches takes the hit. Ricochets onto a
          second ship don't count, and if the first ship it touches is one of
          yours, the shot is just wasted.
      note: >-
        Ships take their fittings + 1 hits to sink. A ship with 3 fittings
        goes down on the 4th hit.
      photo:
        src: /assets/photos/queens-fleet-ship-of-the-line-sails-sm.jpg
        alt: A ship with masts and sails, used for movement testing on a glass table.
    - title: Spend coins
      body:
        - >-
          Coins come from islands you hold. Spend them at the start of your
          turn, as many as you want, then put them back in the bag. Anything
          you don't spend counts as a point at the end.
      coins:
        - { image: /assets/images/coins/coin-skilled-gunner.webp, name: Skilled Gunner, body: One ship fires twice. }
        - { image: /assets/images/coins/coin-repair-crew.webp, name: Repair Crew, body: Put a fitting back on one of your ships. }
        - { image: /assets/images/coins/coin-boarding-party.webp, name: Boarding Party, body: Knock a fitting off an enemy ship you're touching. }
        - { image: /assets/images/coins/coin-brace-for-impact.webp, name: Brace for Impact, body: The next hit on that ship does nothing. }
        - { image: /assets/images/coins/coin-signal-flag.webp, name: Signal Flags, body: One of your ships skips its action so another (yours or an ally's) gets two turns. }
        - { image: /assets/images/coins/coin-evasive-maneuver.webp, name: Evasive Maneuvers, body: One ship slides one ship-width sideways. }
      note: >-
        Boarding Party and Repair Crew together, while touching a dead enemy
        ship, captures it. It joins your fleet with one fitting.
    - title: Win
      body:
        - >-
          If you're the last fleet with ships on the table, you win. Otherwise,
          at the start of your turn you can **declare victory** if you think you
          have 25 points. Everyone counts up. If you're still at 25 or more and
          nobody is ahead of you, you win.
      table:
        head: [What you have, Points]
        rows:
          - [Each ship still afloat, 3]
          - [Each island you hold, 2]
          - [Each unspent coin, 1]
          - [Most ships / islands / coins, +2 each]
  outro: >-
    The rulebook has the rest: boarding, scuttling, the faction abilities, and
    the alternate modes (Group play for big parties, Fleets & Alliances,
    and Custom Armada).
  rulebook:
    - { label: Rulebook (PDF), href: /rulebook/pdf/rulebook.pdf, icon: i-lucide-book-open }
    - { label: Print-and-fold booklet, href: /rulebook/pdf/rulebook-booklet.pdf, icon: i-lucide-printer }
  version: v0.5, September 2026
  changesHref: /live#changes

fleets:
  title: The fleets
  lead: >-
    The base game comes with two fleets. They're a good match for each other,
    and either one works for your first game.
  base:
    - name: Queen's Fleet
      image: /assets/ships/ship-preview-queen-fleet-large-sm.webp?v=0.5
      summary: Well-armed frigates, and the easiest fleet to learn.
      stats:
        - [Ships, '3']
        - [Fittings, 4 each]
        - [Cannon slots, 3 per side]
        - [Move Count, '3']
      ability: Disciplined Crew
      abilityBody: Ships can turn up to 180° instead of 90° when they steer.
      card: /rulebook/pdf/faction-card-queens-fleet.pdf
    - name: Corsairs
      image: /assets/ships/ship-preview-corsairs-sm.webp?v=0.5
      summary: Fast sloops with thin hulls. They do best when they pick their fights.
      stats:
        - [Ships, '3']
        - [Fittings, 3 each]
        - [Cannon slots, 3 per side]
        - [Move Count, '4']
      ability: Plunder
      abilityBody: An extra coin for every successful boarding or island capture.
      card: /rulebook/pdf/faction-card-corsairs.pdf
  addonsTitle: Add-on fleets
  addonsLead: >-
    Five more fleets are in playtesting. They'll be paid add-ons, which is how
    we fund the rest of the work. The faction cards are free to look at.
  addons:
    - name: Treasure Fleet
      image: /assets/ships/ship-preview-treasure-fleet-sm.webp
      stats: 2 junks · 3 fittings · Move 2
      body: Only two ships, but every island they hold pays out double.
      card: /rulebook/pdf/faction-card-treasure-fleet.pdf
    - name: Stone Fleet
      image: /assets/ships/ship-preview-stone-fleet-sm.webp
      stats: 3 barges · 4 fittings · Move 2
      body: Stone ships. They're slow, but each one ignores the first hit it takes every turn.
      card: /rulebook/pdf/faction-card-stone-fleet.pdf
    - name: Shadow Fleet
      image: /assets/ships/ship-preview-shadow-fleet-sm.webp
      stats: 3 galleons · 3 fittings · Move 3
      body: Spend 2 coins to bring a sunken ship back at any island you hold.
      card: /rulebook/pdf/faction-card-shadow-fleet.pdf
    - name: The Industry
      image: /assets/ships/ship-preview-industry-sm.webp
      stats: 3 warships · 2 fittings + turret · Move 3
      body: A forward bow gun plus a turret that fires any direction (until it gets shot off).
      card: /rulebook/pdf/faction-card-the-industry.pdf
    - name: The Islanders
      image: /assets/ships/ship-preview-islanders-sm.webp
      stats: 5 catamarans · 1 fitting · Move 4
      body: Lots of fast, fragile boats with their guns at the back. They start the game already holding an island.
      card: /rulebook/pdf/faction-card-the-islanders.pdf

