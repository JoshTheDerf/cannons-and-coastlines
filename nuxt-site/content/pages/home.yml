  tagline: A Tabletop Naval Conquest Game
  wordmark: /assets/images/wordmark-sm.webp
  subtitle: 2–20 players • 30–90 minutes • Age 12+
  description: >-
    Command your fleet across the open sea. Fire real cannons. Capture islands.
    Plunder treasure. Dominate the waves.
  actions:
    - { label: Get Notified, to: '#signup', variant: solid, icon: i-lucide-mail }
    - { label: Learn to Play, to: '#how-it-plays', variant: outline }

