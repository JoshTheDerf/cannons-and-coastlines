meta:
  title: Cannons & Coastlines | A Tabletop Naval Conquest Game
  description: >-
    A physical tabletop game for 2–20 players where rival fleets battle across
    an open sea. 3D printable, cannon-powered combat meets strategic island
    conquest.

# The big top section.
