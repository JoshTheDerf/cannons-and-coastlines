howItPlays:
  title: How It Plays
  description: No dice. No board. Ships roll, cannons fire, islands pay out.
  features:
    - icon: i-lucide-move
      title: One action per ship
      body: Move it, fire from it, or collect from the island it's touching.
    - icon: i-lucide-crosshair
      title: Real cannons
      body: Load a ball, press the arm, and watch it go. Where it lands is up to you.
    - icon: i-lucide-map
      title: Take islands
      body: Plant a flag to claim one. Held islands pay coins and mount cannons.
    - icon: i-lucide-coins
      title: Spend coins
      body: Full sail for speed. Repair crews to patch a hull. Boarding parties to steal a ship.
  rulebookHref: /rulebook/pdf/rulebook.pdf

